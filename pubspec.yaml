name: mystica_tarot
description: "MysticaTarot — 占卜塔罗牌 Android APP，支持英语 / 他加禄语 / 中文"
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.0

  # Local Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Local Notifications
  flutter_local_notifications: ^17.0.0

  # Audio
  audioplayers: ^6.0.0

  # Internationalization
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter

  # Share
  share_plus: ^9.0.0

  # The following adds the Cupertino Icons font to your application.
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  hive_generator: ^2.0.1
  build_runner: ^2.4.0

  # Mock Testing
  mocktail: ^1.0.0

  # Lint
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/cards/major/
    - assets/images/cards/minor/
    - assets/images/backgrounds/
    - assets/images/icons/
    - assets/images/onboarding/
    - assets/sounds/
    - resources/l10n/

  # fonts: (to be added after downloading PlayfairDisplay and NotoSerifSC)
