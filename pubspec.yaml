name: mystica_tarot
description: "MysticaTarot — 占卜塔罗牌 Android APP，支持英语 / 他加禄语 / 中文"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.0

  # Local Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Local Notifications
  flutter_local_notifications: ^17.0.0

  # Audio
  audioplayers: ^6.0.0

  # Internationalization
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter

  # Share
  # ^11.0.0 最低版本已不再 apply KGP（Kotlin Gradle Plugin），
  # 适配 AGP 8.7+ / Kotlin 2.0+ 且消除 Flutter "outdated: applies KGP" 警告。
  # ^9.0.0 在新版 Daemon 下会触发 flutter_tools 的兼容性警告并可能影响后续编译路径。
  # 详见 docs/bug-log.md Bug #005。
  share_plus: ^11.0.0

  # The following adds the Cupertino Icons font to your application.
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  hive_generator: ^2.0.1
  build_runner: ^2.4.0

  # Mock Testing
  mocktail: ^1.0.0

  # Lint
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/cards/major/
    - assets/images/cards/minor/
    - assets/images/backgrounds/
    - assets/images/icons/
    - assets/images/onboarding/
    - assets/sounds/
    - resources/l10n/
    - lib/features/tarot/data/json/
    - lib/features/astrology/data/json/
    - lib/features/fortune_slip/data/json/
    - lib/features/oracle_cards/data/json/

  fonts:
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Regular.ttf
        - asset: assets/fonts/PlayfairDisplay-Italic.ttf
          style: italic
    - family: NotoSerifSC
      fonts:
        - asset: assets/fonts/NotoSerifSC-Variable.ttf
