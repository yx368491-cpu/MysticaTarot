org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# 开启守护进程，稳定复用进程
org.gradle.daemon=true
# 限制并行编译线程，减少文件争抢。
# 关键：workers.max=1 是为了规避 Kotlin daemon 的 PersistentHashMap
# 并发注册报错（'Storage for class-fq-name-to-source.tab is already
# registered'）。一旦 Kotlin 工具链稳定，可恢复 2+ worker。
# 详见 docs/bug-log.md Bug #005。
org.gradle.parallel=true
org.gradle.workers.max=1
# 禁用 Kotlin incremental compilation（与上一条正交，不是层级关系）。
# 这条从源头消除 .tab 持久化缓存：IncrementalCompilationContext.close()
# 不再 enumerate .tab 文件，PersistentHashMap [init] 路径消失。
# 两条安全网同时启用作为 belt-and-suspenders：
#   - workers.max=1：守住 Gradle 调度层并发
#   - kotlin.incremental=false：守住 Kotlin daemon 内的 .tab 注册路径
# 其一不能取代另一个。详见 docs/bug-log.md Bug #005。
kotlin.incremental=false
# 延长文件锁等待超时时间（默认120s，拉到300s）
systemProp.org.gradle.internal.io.lock.timeout=300000
# 禁用文件缓存锁竞争优化
org.gradle.cache.lock.timeout=300000